data:
  image_size: 96
  num_classes: 18
  csv_path: data/metadata.csv
  images_dir: data/images

diffusion:
  T: 1000
  schedule: cosine

unet:
  base_channels: 64
  channel_mults: [1, 2, 4, 4]
  num_res_blocks: 3
  attn_resolutions: [12, 6]
  time_emb_dim: 256
  class_emb_dim: 256
  num_groups: 8
  cond_mode: cross_attn       # 'additive' (run 1/2 baseline) or 'cross_attn'
  selective_cond: true        # encoder+bottleneck get only time, decoder gets full

training:
  epochs: 1500
  batch_size: 32
  lr: 2.0e-4
  ema_decay: 0.999
  cfg_drop_prob: 0.4
  grad_clip: 1.0
  seed: 42
  sample_every_epochs: 25
  checkpoint_every_epochs: 50

sampling:
  num_steps: 50
  guidance_scale: 3.0
  classes_to_sample: [6, 9, 17]
  samples_per_class: 4

paths:
  checkpoint_dir: checkpoints
