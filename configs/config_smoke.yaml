data:
  image_size: 96
  num_classes: 18
  csv_path: data/metadata.csv
  images_dir: data/images
diffusion:
  T: 1000
  schedule: cosine
unet:
  base_channels: 64
  channel_mults:
  - 1
  - 2
  - 4
  - 4
  num_res_blocks: 3
  attn_resolutions:
  - 12
  - 6
  time_emb_dim: 256
  class_emb_dim: 256
  num_groups: 8
training:
  epochs: 1
  batch_size: 32
  lr: 0.0002
  ema_decay: 0.999
  cfg_drop_prob: 0.1
  grad_clip: 1.0
  seed: 42
  sample_every_epochs: 1
  checkpoint_every_epochs: 1
sampling:
  num_steps: 50
  guidance_scale: 3.0
  classes_to_sample:
  - 6
  - 9
  - 17
  samples_per_class: 4
paths:
  checkpoint_dir: checkpoints
